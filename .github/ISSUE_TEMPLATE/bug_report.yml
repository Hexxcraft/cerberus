name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cerberus version / commit
  - type: input
    id: env
    attributes:
      label: Windows version, Python version, Ollama version
  - type: textarea
    id: report
    attributes:
      label: Review report (optional)
      description: "Run `python -m cerberus.telemetry --days 1` and paste the relevant part. Secrets are scrubbed, but check before posting."
