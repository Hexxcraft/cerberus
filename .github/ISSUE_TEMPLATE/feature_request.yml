name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: safety
    attributes:
      label: Does it touch the PC, the network, or secrets?
      description: New tools must keep the consent rules (heads' vote + user approval, local-only where needed). Say how.
